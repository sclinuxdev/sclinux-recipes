schema_version = 1

[package]
name = "file"
version = "5.48"
release = 1
epoch = 0
description = "File type identification utility and libmagic"
license = "BSD-2-Clause-Darwin"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "bzip2",
    "xz-libs = 5.8.3-1",
    "zlib-libs = 1.3.1-1",
    "zstd-libs = 1.5.7-1"
]

provides = [
    "so:libmagic.so.1"
]

[source]
url = "https://astron.com/pub/file/file-5.48.tar.gz"
sha256 = "ed14656883b23a364b4057c05595d93252da9bc473d30106519519d0da141283"

[build]
inherit = ["autotools"]

dependencies = [
    "virtual/libc-dev",
    "gcc16/gcc:16",
    "gcc16/gcc-dev:16",
    "system/bzip2-dev",
    "system/xz-dev",
    "system/zlib-dev",
    "system/zstd-dev"
]

[build.args]
configure_args = "--datadir=/usr/share/file --enable-fsect-man5 --disable-libseccomp --disable-landlock --disable-static"

[build.payload]
default = "remaining"
