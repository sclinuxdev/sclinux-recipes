schema_version = 1

[package]
name = "polkit"
version = "127"
release = 1
epoch = 0
description = "Authorization framework for controlling privileged operations"
license = "LGPL-2.0-or-later"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "dbus",
    "duktape",
    "glib2",
    "pam",
    "systemd-libs"
]

provides = [
    "polkit"
]

[source]
url = "https://github.com/polkit-org/polkit/archive/refs/tags/127.tar.gz"
sha256 = "9b7bc16f086479dcc626c575976568ba4a85d34297a750d8ab3d2e57f6d8b988"

[build]
inherit = [
    "meson"
]

dependencies = [
    "virtual/libc-dev",
    "gcc16/gcc:16",
    "gcc16/gcc-dev:16",
    "system/pkgconf",
    "system/dbus-dev",
    "system/duktape-dev",
    "system/glib2-dev",
    "system/pam-dev",
    "system/systemd-dev"
]

[build.args]
meson_args = "-Dsession_tracking=logind -Dauthfw=pam -Dintrospection=false -Dgtk_doc=false -Dman=false -Dgettext=false -Dtests=false -Dexamples=false"

[build.payload]
default = "remaining"

[[sysusers]]
name = "polkitd"
type = "group"
id = 27

[[sysusers]]
name = "polkitd"
type = "user"
id = 27
