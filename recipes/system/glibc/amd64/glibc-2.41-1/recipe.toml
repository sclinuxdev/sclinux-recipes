schema_version = 1

[package]
name = "glibc"
version = "2.41"
release = 1
epoch = 0
description = "GNU C Library implementation"
license = "LGPL-2.1-or-later AND GPL-3.0-or-later"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/filesystem",
    "glibc-libs = 2.41-1"
]

provides = [
    "virtual/libc"
]

[source]
url = "https://ftp.gnu.org/gnu/glibc/glibc-2.41.tar.xz"
sha256 = "a5a26b22f545d6b7d7b3dd828e11e428f24f4fac43c934fb071b6a7d0828e901"

[build]
inherit = ["custom"]

[build.args]
install_cmd = 'mkdir -p /build && cd /build && CFLAGS="-O2 -march=x86-64 -pipe" CXXFLAGS="-O2 -march=x86-64 -pipe" ${SRC_DIR}/configure --prefix=/usr --enable-kernel=5.4 --enable-stack-protector=strong --disable-profile --disable-werror && make -j${JOBS} && make DESTDIR=${DESTDIR} install'

[build.payload]
default = "remaining"

[[subpackages]]
name = "glibc-libs"
description = "GNU C Library runtime shared libraries and dynamic linker"
license = "LGPL-2.1-or-later"

provides = [
    "virtual/libc",
    "so:libc.so.6",
    "so:ld-linux-x86-64.so.2"
]

[subpackages.payload]
files = [
    "usr/lib/*.so.*",
    "usr/lib/ld-*.so*"
]

[[subpackages]]
name = "glibc-dev"
description = "GNU C Library headers and static development libraries"
license = "LGPL-2.1-or-later"

dependencies = [
    "glibc-libs = 2.41-1"
]

provides = [
    "virtual/libc-dev"
]

[subpackages.payload]
files = [
    "usr/include/**",
    "usr/lib/*.so",
    "usr/lib/*.o",
    "usr/lib/*.a"
]
