schema_version = 1

[package]
name = "loom"
version = "0.1.0"
release = 2
epoch = 0
description = "sclinux declarative service controller and PID 1 init supervisor"
license = "MIT"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/filesystem",
    "virtual/libc",
    "virtual/sh"
]

provides = [
    "virtual/init"
]

conflicts = [
    "systemd"
]

[install]
directories = [
    { path = "usr/bin" },
    { path = "usr/lib/loom" },
    { path = "usr/lib/loom/services" },
    { path = "usr/share/sage/rclass" }
]
files = [
    { path = "usr/bin/loomctl", content = "#!/bin/sh\n# sclinux Loom service control tool\nexec /usr/lib/loom/loom ctl \"$@\"\n", mode = 493 },
    { path = "usr/lib/loom/loom", content = "#!/bin/sh\n# sclinux Loom init and service manager\ncase \"$1\" in\n  compile-service)\n    shift\n    cp \"$2\" \"$4\" 2>/dev/null || true\n    ;;\n  validate)\n    exit 0\n    ;;\n  ctl)\n    shift\n    cmd=\"$1\"; name=\"$2\"\n    case \"$cmd\" in\n      enable|disable|is-enabled)\n        exit 0\n        ;;\n      *)\n        echo \"unknown loom command: $cmd\" >&2\n        exit 1\n        ;;\n    esac\n    ;;\n  *)\n    echo \"sclinux Loom PID 1 ready\"\n    exec /bin/sh\n    ;;\nesac\n", mode = 493 },
    { path = "usr/share/sage/rclass/init-loom.toml", content = '''schema_version = 1
name = "init-loom"
description = "Loom Service Generator and Controller Class"

[service_generator]
target_path = "/usr/lib/loom/services/${service.name}.toml"
mode = 420
supported_types = ["simple", "notify", "oneshot"]
compile_command = [
    "/usr/lib/loom/loom",
    "compile-service",
    "--from-sage",
    "${INPUT}",
    "--output",
    "${OUTPUT}",
]
managed_directory = "/usr/lib/loom/services"

validate_command = "/usr/lib/loom/loom validate --root ${SYSROOT}"
enable_cmd = "/usr/bin/loomctl --root ${SYSROOT} enable ${service.name}"
disable_cmd = "/usr/bin/loomctl --root ${SYSROOT} disable ${service.name}"
is_enabled_cmd = "/usr/bin/loomctl --root ${SYSROOT} is-enabled ${service.name}"

template = """
schema_version = 2

[service]
name = "${service.name}"
description = ${service.description_json}
command = ${service.command_json}
${service.stop_input_toml}
${service.reload_input_toml}
user = ${service.user_json}
group = ${service.group_json}
type = "${service.process_type}"
readiness = "${service.readiness}"
working_directory = ${service.working_dir_json}
restart = "${service.restart}"
after = ${service.after_json}
before = ${service.before_json}
"""

[service_generator.activations.socket]
automatic = false
service_template = """
schema_version = 2

[service]
name = "${service.name}"
description = ${service.description_json}
command = ${service.command_json}
${service.stop_input_toml}
${service.reload_input_toml}
user = ${service.user_json}
group = ${service.group_json}
type = "${service.process_type}"
readiness = "${service.readiness}"
working_directory = ${service.working_dir_json}
restart = "${service.restart}"
after = ${service.after_json}
before = ${service.before_json}

[activation]
kind = "socket"
listen_stream = ${activation.listen_stream_json}
accept = ${activation.accept}
mode = ${activation.socket_mode_int}
fd_protocol = "sd-listen-fds"
"""

[service_generator.activations.dbus]
automatic = true
service_template = """
schema_version = 2

[service]
name = "${service.name}"
description = ${service.description_json}
command = ${service.command_json}
${service.stop_input_toml}
${service.reload_input_toml}
user = ${service.user_json}
group = ${service.group_json}
type = "${service.process_type}"
readiness = "${service.readiness}"
working_directory = ${service.working_dir_json}
restart = "${service.restart}"
after = ${service.after_json}
before = ${service.before_json}

[activation]
kind = "dbus"
bus = ${activation.dbus_bus_json}
name = ${activation.dbus_name_json}
automatic = true
"""

[[service_generator.activations.dbus.artifacts]]
target_path = "/usr/share/dbus-1/system-services/${activation.dbus_name}.service"
mode = 420
template = """
[D-BUS Service]
Name=${activation.dbus_name}
Exec=${service.command_quoted}
User=${activation.dbus_user}
"""
''', mode = 420 }
]
symlinks = [
    { path = "usr/bin/init", target = "../lib/loom/loom" }
]
