    "usr/lib/firmware/mrvl/**",
    "usr/lib/firmware/mwl8k/**",
    "usr/lib/firmware/mwlwifi/**"
]

[[subpackages]]
name = "linux-firmware-mediatek"
description = "Firmware for MediaTek and Ralink devices"
license = "LicenseRef-mediatek"
dependencies = [
