schema_version = 1

[package]
name = "intel-ucode"
version = "20260812"
release = 1
epoch = 0
description = "Microcode update files for Intel CPUs"
license = "LicenseRef-Intel-ucode"
channel = "system"
arch = "any"

[source]
url = "https://github.com/intel/Intel-Linux-Processor-Microcode-Data-Files/archive/refs/tags/microcode-20260812.tar.gz"
sha256 = "7614616d7b2988c278060486f47de716ef44c19317928cb45ac9e288fafd5bd1"

[build]
inherit = ["custom"]

dependencies = [
    "system/coreutils",
    "system/cpio",
    "system/findutils"
]

[build.args]
install_cmd = """
set -eu

mkdir -p kernel/x86/microcode
find intel-ucode intel-ucode-with-caveats -maxdepth 1 -type f ! -name list -print0 \\
    | sort -z \\
    | xargs -0 cat > kernel/x86/microcode/GenuineIntel.bin
if [ -n "${SOURCE_DATE_EPOCH:-}" ]; then
    touch -d "@${SOURCE_DATE_EPOCH}" kernel/x86/microcode/GenuineIntel.bin
fi

install -d "${DESTDIR}/usr/lib/firmware/intel-ucode"
find intel-ucode -maxdepth 1 -type f ! -name list \
    -exec install -m0644 {} "${DESTDIR}/usr/lib/firmware/intel-ucode/" \\;
install -d "${DESTDIR}/boot"
printf '%s\\0' kernel/x86/microcode/GenuineIntel.bin | cpio --null --create --format=newc > "${DESTDIR}/boot/intel-ucode.img"
install -Dm644 license "${DESTDIR}/usr/share/licenses/intel-ucode/LICENSE"
"""

[build.payload]
default = "remaining"
