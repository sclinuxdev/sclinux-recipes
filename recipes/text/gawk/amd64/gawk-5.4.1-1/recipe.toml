schema_version = 1

[package]
name = "gawk"
version = "5.4.1"
release = 1
epoch = 0
description = "GNU awk pattern scanning and processing language"
license = "GPL-3.0-or-later"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "mpfr-libs >= 4.2.2-1"
]

provides = [
    "virtual/awk"
]

[source]
url = "https://ftp.gnu.org/gnu/gawk/gawk-5.4.1.tar.xz"
sha256 = "07f6f7342b7febe4313fc2c2542ad93d64fe20ad8717200109f105a826f5fd37"

[build]
inherit = ["autotools"]

[build.args]
configure_args = "--without-libsigsegv"

[build.payload]
default = "remaining"
