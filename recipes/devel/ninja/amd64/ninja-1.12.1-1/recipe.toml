schema_version = 1

[package]
name = "ninja"
version = "1.12.1"
release = 1
epoch = 0
description = "Small build system with a focus on speed"
license = "Apache-2.0"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "system/gcc-libs:16"
]

[source]
url = "https://github.com/ninja-build/ninja/archive/refs/tags/v1.12.1.tar.gz"
sha256 = "821bdff48a3f683bc4bb3b6f0b5fe7b2d647cf65d52aeb63328c91a6c6df285a"

[build]
inherit = ["custom"]

dependencies = [
    "virtual/libc-dev",
    "python3.14/python:3.14",
    "gcc16/gcc:16",
    "gcc16/gcc-dev:16"
]

[build.args]
compile_cmd = "python3 configure.py --bootstrap"
install_cmd = 'python3 ./configure.py --bootstrap && install -Dm755 ninja ${DESTDIR}/usr/bin/ninja'

[build.payload]
default = "remaining"
