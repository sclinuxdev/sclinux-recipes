schema_version = 1

[package]
name = "autoconf"
version = "2.72"
release = 1
epoch = 0
description = "Extensible package of M4 macros for configuring source code packages"
license = "GPL-3.0-or-later"
channel = "system"
arch = "any"

dependencies = [
    "system/m4 >= 1.4.19-1",
    "system/perl >= 5.40.1-1",
    "virtual/sh"
]

[source]
url = "https://ftp.gnu.org/gnu/autoconf/autoconf-2.72.tar.xz"
sha256 = "ba885c1319578d6c94d46e9b0dceb4014caafe2490e437a0dbca3f270a223f5a"

[build]
inherit = ["custom"]

dependencies = [
    "system/m4 >= 1.4.19-1",
    "system/perl >= 5.40.1-1"
]

[build.args]
compile_cmd = "./configure --prefix=/usr && make -j${JOBS}"
install_cmd = './configure --prefix=/usr && make -j${JOBS} && make DESTDIR=${DESTDIR} install'

[build.payload]
default = "remaining"
