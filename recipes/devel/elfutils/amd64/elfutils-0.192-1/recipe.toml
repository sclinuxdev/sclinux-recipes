schema_version = 1

[package]
name = "elfutils"
version = "0.192"
release = 1
epoch = 0
description = "Libraries and tools for handling ELF files and DWARF data"
license = "GPL-3.0-or-later"
channel = "system"
arch = "amd64"

dependencies = [
    "system/elfutils-libs >= 0.192-1"
]

[source]
url = "https://sourceware.org/elfutils/ftp/0.192/elfutils-0.192.tar.bz2"
sha256 = "616099beae24aba11f9b63d86ca6cc8d566d968b802391334c91df54eab416b4"

[build]
inherit = ["custom"]

dependencies = [
    "system/zlib-dev >= 1.3.1-1",
    "system/zstd-dev >= 1.5.7-1"
]

[build.args]
compile_cmd = './configure --prefix=/usr --disable-debuginfod --disable-libdebuginfod CFLAGS="${CFLAGS} -Wno-error" && make -j${JOBS}'
install_cmd = './configure --prefix=/usr --disable-debuginfod --disable-libdebuginfod CFLAGS="${CFLAGS} -Wno-error" && make -j${JOBS} && make DESTDIR=${DESTDIR} install'

[build.payload]
default = "remaining"

[[subpackages]]
name = "elfutils-libs"
description = "elfutils runtime libraries (libelf, libdw)"
license = "GPL-2.0-or-later OR LGPL-3.0-or-later"

dependencies = [
    "virtual/libc",
    "system/zlib-libs >= 1.3.1-1",
    "system/zstd-libs >= 1.5.7-1"
]

provides = [
    "so:libelf.so.1",
    "so:libdw.so.1"
]

[subpackages.payload]
files = [
    "usr/lib/*.so.*"
]

[[subpackages]]
name = "libelf-dev"
description = "libelf development headers and pkgconfig"
license = "GPL-2.0-or-later OR LGPL-3.0-or-later"

dependencies = [
    "system/elfutils-libs >= 0.192-1"
]

provides = [
    "system/libelf-dev"
]

[subpackages.payload]
files = [
    "usr/include/libelf.h",
    "usr/include/gelf.h",
    "usr/include/nlist.h",
    "usr/include/elfutils/**",
    "usr/include/dwarf.h",
    "usr/lib/libelf.so",
    "usr/lib/libdw.so",
    "usr/lib/libasm.so",
    "usr/lib/pkgconfig/**"
]
