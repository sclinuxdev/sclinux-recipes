schema_version = 1

[package]
name = "fastfetch"
version = "2.68.1"
release = 1
epoch = 0
description = "Fast and feature-rich neofetch-like system information tool"
license = "MIT"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "virtual/os-release",
    "system/zlib-libs >= 1.3.1-1"
]

[source]
url = "https://github.com/fastfetch-cli/fastfetch/archive/refs/tags/2.68.1.tar.gz"
sha256 = "c268cfcd230cc7ed5447fb34ed21bf4977315c7104356a39388b6ba784ad11b0"

[build]
inherit = ["cmake"]

dependencies = [
    "system/linux-headers >= 7.2.4-1",
    "system/pkgconf >= 3.0.7-1",
    "system/zlib-dev >= 1.3.1-1"
]

[build.args]
cmake_args = "-DBUILD_TESTS=OFF -DENABLE_SYSTEM_YYJSON=OFF -DENABLE_LTO=ON -DENABLE_VULKAN=OFF -DENABLE_WAYLAND=OFF -DENABLE_XCB_RANDR=OFF -DENABLE_XRANDR=OFF -DENABLE_DRM=OFF -DENABLE_VADRM=OFF -DENABLE_VAX11=OFF -DENABLE_VDPAU=OFF -DENABLE_GIO=OFF -DENABLE_DCONF=OFF -DENABLE_DBUS=OFF -DENABLE_SQLITE3=OFF -DENABLE_EGL=OFF -DENABLE_GLX=OFF -DENABLE_PULSE=OFF -DENABLE_LUA=OFF -DENABLE_ELF=OFF"

[build.payload]
default = "remaining"
