schema_version = 1

[package]
name = "which"
version = "2.21"
release = 1
epoch = 0
description = "Displays the full path of shell commands"
license = "GPL-3.0-or-later"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc"
]

[source]
url = "https://ftp.gnu.org/gnu/which/which-2.21.tar.gz"
sha256 = "f4a245b94124b377d8b49646bf421f9155d36aa7614b6ebf83705d3ffc76eaad"

[build]
inherit = ["custom"]

[build.args]
compile_cmd = "./configure --prefix=/usr && make -j${JOBS}"
install_cmd = './configure --prefix=/usr && make -j${JOBS} && make DESTDIR=${DESTDIR} install'

[build.payload]
default = "remaining"
