schema_version = 1

[package]
name = "fribidi"
version = "1.0.16"
release = 1
epoch = 0
description = "Unicode bidirectional algorithm library"
license = "LGPL-2.1-or-later"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc"
]

provides = [
    "so:libfribidi.so.0"
]

[source]
url = "https://github.com/fribidi/fribidi/releases/download/v1.0.16/fribidi-1.0.16.tar.xz"
sha256 = "1b1cde5b235d40479e91be2f0e88a309e3214c8ab470ec8a2744d82a5a9ea05c"

[build]
inherit = [
    "meson"
]

dependencies = [
    "virtual/libc-dev",
    "gcc16/gcc:16",
    "gcc16/gcc-dev:16",
    "system/pkgconf"
]

[build.args]
meson_args = "-Ddocs=disabled -Dtests=disabled"

[build.payload]
default = "remaining"

[[subpackages]]
name = "fribidi-dev"
description = "Unicode bidirectional algorithm library development files"
license = "LGPL-2.1-or-later"

dependencies = [
    "fribidi = 1.0.16-1"
]

[subpackages.payload]
files = [
    "usr/include/**",
    "usr/lib/*.so",
    "usr/lib/*.a",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**"
]
