schema_version = 1

[package]
name = "wlroots"
version = "0.20.2"
release = 1
epoch = 0
description = "Modular Wayland compositor library"
license = "MIT"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "libdisplay-info",
    "libdrm",
    "libinput",
    "libxkbcommon",
    "pixman",
    "seatd",
    "wayland"
]

provides = [
    "so:libwlroots-0.20.so.0"
]

[source]
url = "https://gitlab.freedesktop.org/wlroots/wlroots/-/archive/0.20.2/wlroots-0.20.2.tar.gz"
sha256 = "972c7ac44b17828f4702bfae7cd8347346a3fb5b2c1076cfa2c3fcedac5ec343"

[build]
inherit = ["meson"]

dependencies = [
    "virtual/libc-dev",
    "gcc16/gcc:16",
    "gcc16/gcc-dev:16",
    "system/hwdata",
    "system/libdisplay-info-dev",
    "system/libdrm-dev",
    "system/libinput-dev",
    "system/libxkbcommon-dev",
    "system/linux-headers >= 7.2.4-1",
    "system/pixman-dev",
    "system/seatd-dev",
    "system/systemd-dev",
    "system/wayland-dev",
    "system/wayland-protocols"
]

[build.args]
# SCLinux targets a native, seatd-backed Wayland compositor. Keep Xwayland,
# Vulkan, GBM, libliftoff, and color-management out of this pure-Wayland
# baseline; the always-built pixman renderer remains available. Disabling
# auto_features makes the default renderer/allocator arrays resolve to empty.
meson_args = "-Dauto_features=disabled -Dbackends=drm,libinput -Dsession=enabled -Dxwayland=disabled -Dxcb-errors=disabled -Dexamples=false -Dlibliftoff=disabled -Dcolor-management=disabled"

[build.payload]
default = "remaining"

[[subpackages]]
name = "wlroots-dev"
description = "Modular Wayland compositor library development files"
license = "MIT"
dependencies = [
    "wlroots = 0.20.2-1"
]

[subpackages.payload]
files = [
    "usr/include/**",
    "usr/lib/libwlroots-0.20.so",
    "usr/lib/pkgconfig/**"
]
