schema_version = 1

[package]
name = "mpc"
version = "1.4.1"
release = 1
epoch = 0
description = "C library for multiple precision complex arithmetic"
license = "LGPL-3.0-or-later"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "mpc-libs = 1.4.1-1"
]

[source]
url = "https://ftp.gnu.org/gnu/mpc/mpc-1.4.1.tar.xz"
sha256 = "91204cd32f164bd3b7c992d4a6a8ce6519511aadab30f78b6982d0bf8d73e931"

[build]
inherit = ["autotools"]

[build.payload]
default = "remaining"

[[subpackages]]
name = "mpc-libs"
description = "C library for multiple precision complex arithmetic runtime shared library"
license = "LGPL-3.0-or-later"

dependencies = [
    "virtual/libc",
    "gmp-libs >= 6.3.0-1",
    "mpfr-libs >= 4.2.2-1"
]

provides = [
    "so:libmpc.so.3"
]

[subpackages.payload]
files = [
    "usr/lib/*.so.*"
]

[[subpackages]]
name = "mpc-dev"
description = "Multiple precision complex arithmetic development headers"
license = "LGPL-3.0-or-later"

dependencies = [
    "mpc-libs = 1.4.1-1",
    "mpfr-dev"
]

[subpackages.payload]
files = [
    "usr/include/**",
    "usr/lib/*.so"
]
