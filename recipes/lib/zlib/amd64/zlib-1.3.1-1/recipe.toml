schema_version = 1

[package]
name = "zlib"
version = "1.3.1"
release = 1
epoch = 0
description = "Massively spiffy yet delicately unobtrusive compression library"
license = "Zlib"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "zlib-libs = 1.3.1-1"
]

[source]
url = "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.xz"
sha256 = "38ef96b8dfe510d42707d9c781877914792541133e1870841463bfa73f883e32"

[build]
inherit = ["custom"]

[build.args]
install_cmd = './configure --prefix=/usr && make -j${JOBS} && make DESTDIR=${DESTDIR} install'
configure_args = "--prefix=/usr --shared"

[build.payload]
default = "remaining"

[[subpackages]]
name = "zlib-libs"
description = "zlib compression runtime shared library"
license = "Zlib"

dependencies = [
    "virtual/libc"
]

provides = [
    "so:libz.so.1"
]

[subpackages.payload]
files = [
    "usr/lib/libz.so.*"
]

[[subpackages]]
name = "zlib-dev"
description = "zlib development headers and static libraries"
license = "Zlib"

dependencies = [
    "zlib-libs = 1.3.1-1"
]

[subpackages.payload]
files = [
    "usr/include/**",
    "usr/lib/libz.so",
    "usr/lib/pkgconfig/*.pc"
]
