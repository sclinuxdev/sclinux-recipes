schema_version = 1

[package]
name = "isl"
version = "0.26"
release = 1
epoch = 0
description = "Library for manipulating sets and relations of integer points bounded by linear constraints"
license = "MIT"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "isl-libs = 0.26-1"
]

[source]
url = "https://downloads.sourceforge.net/project/libisl/isl-0.26.tar.bz2"
sha256 = "5eac8664e9d67be6bd0bee5085d6840b8baf738c06814df47eaf4166d9776436"

[build]
inherit = ["autotools"]

[build.payload]
default = "remaining"

[[subpackages]]
name = "isl-libs"
description = "Integer Set Library runtime shared library"
license = "MIT"

dependencies = [
    "virtual/libc",
    "gmp-libs >= 6.3.0-1"
]

provides = [
    "so:libisl.so.23"
]

[subpackages.payload]
files = [
    "usr/lib/*.so.*"
]

[[subpackages]]
name = "isl-dev"
description = "Integer Set Library headers and development files"
license = "MIT"

dependencies = [
    "isl-libs = 0.26-1",
    "gmp-dev"
]

[subpackages.payload]
files = [
    "usr/include/**",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/*.pc"
]
