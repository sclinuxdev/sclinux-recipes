schema_version = 1

[package]
name = "readline"
version = "8.3"
release = 1
epoch = 0
description = "GNU readline library for command-line editing"
license = "GPL-3.0-or-later"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "readline-libs = 8.3-1"
]

[source]
url = "https://ftp.gnu.org/gnu/readline/readline-8.3.tar.gz"
sha256 = "fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc"

[build]
inherit = ["autotools"]

[build.args]
configure_args = "--with-curses"
make_args = 'SHLIB_LIBS="-lncursesw"'
install_args = 'SHLIB_LIBS="-lncursesw"'

[build.payload]
default = "remaining"

[[subpackages]]
name = "readline-libs"
description = "GNU readline runtime shared library"
license = "GPL-3.0-or-later"

dependencies = [
    "virtual/libc",
    "ncurses-libs >= 6.6-1"
]

provides = [
    "so:libreadline.so.8",
    "so:libhistory.so.8"
]

[subpackages.payload]
files = [
    "usr/lib/*.so.*"
]

[[subpackages]]
name = "readline-dev"
description = "GNU readline development headers"
license = "GPL-3.0-or-later"

dependencies = [
    "readline-libs = 8.3-1",
    "ncurses-dev"
]

[subpackages.payload]
files = [
    "usr/include/**",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/*.pc"
]
