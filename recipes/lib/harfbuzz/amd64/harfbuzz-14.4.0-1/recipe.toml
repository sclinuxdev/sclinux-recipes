schema_version = 1

[package]
name = "harfbuzz"
version = "14.4.0"
release = 1
epoch = 0
description = "Text shaping engine"
license = "MIT"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc"
]

provides = [
    "so:libharfbuzz.so.0"
]

[source]
url = "https://github.com/harfbuzz/harfbuzz/releases/download/14.4.0/harfbuzz-14.4.0.tar.xz"
sha256 = "0ef4874f2a5d88b4769069aad6d035646eb281da8bd4ad1bcbdeb44ca91a997e"

[build]
inherit = [
    "meson"
]

dependencies = [
    "virtual/libc-dev",
    "gcc16/gcc:16",
    "gcc16/gcc-dev:16",
    "system/pkgconf"
]

[build.args]
meson_args = "-Dcairo=disabled -Dfreetype=disabled -Dicu=disabled -Dgraphite=disabled -Dtests=disabled"

[build.payload]
default = "remaining"

[[subpackages]]
name = "harfbuzz-dev"
description = "Text shaping engine development files"
license = "MIT"

dependencies = [
    "harfbuzz = 14.4.0-1"
]

[subpackages.payload]
files = [
    "usr/include/**",
    "usr/lib/*.so",
    "usr/lib/*.a",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**"
]
