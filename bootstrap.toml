# SCLinux Bootstrap Pipeline Configuration (Schema v1)
# 驱动命令: sage bootstrap bootstrap.toml [--output <pool>] [--jobs N]

schema_version = 1

# 阶段 0: 建立操作系统标准目录树与系统标识 (无编译产物，纯 FHS 骨架与 Rolling os-release)
[[stages]]
name = "stage0-skeleton"
recipes = [
    "recipes/system/filesystem/any/filesystem-1.0.0-1/recipe.toml",
    "recipes/system/os-release/any/os-release-1.0.0-1/recipe.toml"
]

# 阶段 1: 核心基础 C 运行库、内核接口头文件与基础压缩
[[stages]]
name = "stage1-runtime"
recipes = [
    "recipes/system/glibc/amd64/glibc-2.41-1/recipe.toml",
    "recipes/devel/linux-headers/amd64/linux-headers-7.2.4-1/recipe.toml",
    "recipes/devel/binutils/amd64/binutils-2.44-1/recipe.toml",
    "recipes/lib/zlib/amd64/zlib-1.3.1-1/recipe.toml",
    "recipes/lib/zstd/amd64/zstd-1.5.7-1/recipe.toml"
]

# 阶段 2: 构建引擎、文本差异与底层基础构建库
[[stages]]
name = "stage2-build-tools"
recipes = [
    "recipes/devel/make/amd64/make-4.4.1-1/recipe.toml",
    "recipes/devel/m4/amd64/m4-1.4.19-1/recipe.toml",
    "recipes/devel/pkgconf/amd64/pkgconf-3.0.7-1/recipe.toml",
    "recipes/devel/patch/amd64/patch-2.8-1/recipe.toml",
    "recipes/lib/libcap/amd64/libcap-2.78-1/recipe.toml",
    "recipes/text/diffutils/amd64/diffutils-3.11-1/recipe.toml",
    "recipes/utils/findutils/amd64/findutils-4.10.0-1/recipe.toml"
]

# 阶段 3: 编译器核心代数支持库与终端支持库 (GMP, MPFR, MPC, ISL, Ncurses, Readline)
[[stages]]
name = "stage3-compiler-libs"
recipes = [
    "recipes/lib/gmp/amd64/gmp-6.3.0-1/recipe.toml",
    "recipes/lib/mpfr/amd64/mpfr-4.2.2-1/recipe.toml",
    "recipes/lib/mpc/amd64/mpc-1.4.1-1/recipe.toml",
    "recipes/lib/isl/amd64/isl-0.26-1/recipe.toml",
    "recipes/lib/ncurses/amd64/ncurses-6.6-1/recipe.toml",
    "recipes/lib/readline/amd64/readline-8.3-1/recipe.toml"
]

# 阶段 4: 自举编译器、语法解析器与文档工具 (GCC, Bison, Flex, Texinfo)
[[stages]]
name = "stage4-compiler"
recipes = [
    "recipes/devel/bison/amd64/bison-3.8.2-1/recipe.toml",
    "recipes/devel/flex/amd64/flex-2.6.4-1/recipe.toml",
    "recipes/devel/texinfo/amd64/texinfo-7.1.1-1/recipe.toml",
    "recipes/devel/gcc/amd64/gcc-16.2.0-2/recipe.toml"
]

# 阶段 5: 核心用户态命令集、压缩归档、终端与 Shell 环境
[[stages]]
name = "stage5-coreutils-and-shell"
recipes = [
    "recipes/security/ca-certificates/any/ca-certificates-2024.1-1/recipe.toml",
    "recipes/utils/coreutils/amd64/coreutils-9.6-1/recipe.toml",
    "recipes/text/sed/amd64/sed-4.10-1/recipe.toml",
    "recipes/text/grep/amd64/grep-3.12-1/recipe.toml",
    "recipes/tools/tar/amd64/tar-1.35-1/recipe.toml",
    "recipes/tools/xz/amd64/xz-5.8.3-1/recipe.toml",
    "recipes/tools/gzip/amd64/gzip-1.13-1/recipe.toml",
    "recipes/utils/which/amd64/which-2.21-1/recipe.toml",
    "recipes/text/bash/amd64/bash-5.3-1/recipe.toml",
    "recipes/text/gawk/amd64/gawk-5.4.1-1/recipe.toml"
]

# 阶段 6: 扩展构建链、自动构建系统与内核自举工具
[[stages]]
name = "stage6-toolchain-extended"
recipes = [
    "recipes/devel/perl/amd64/perl-5.40.1-1/recipe.toml",
    "recipes/devel/autoconf/any/autoconf-2.72-1/recipe.toml",
    "recipes/devel/automake/any/automake-1.17-1/recipe.toml",
    "recipes/devel/libtool/amd64/libtool-2.5.4-1/recipe.toml",
    "recipes/devel/ninja/amd64/ninja-1.12.1-1/recipe.toml",
    "recipes/devel/cmake/amd64/cmake-3.31.5-1/recipe.toml",
    "recipes/lib/xxhash/amd64/xxhash-0.8.3-1/recipe.toml",
    "recipes/devel/elfutils/amd64/elfutils-0.192-1/recipe.toml",
    "recipes/security/openssl/amd64/openssl-3.4.1-1/recipe.toml",
    "recipes/devel/gettext/amd64/gettext-0.23.1-1/recipe.toml",
    "recipes/utils/bc/amd64/bc-1.07.1-1/recipe.toml",
    "recipes/tools/cpio/amd64/cpio-2.15-1/recipe.toml",
    "recipes/devel/gperf/amd64/gperf-3.1-1/recipe.toml",
    "recipes/lib/libffi/amd64/libffi-3.4.6-1/recipe.toml",
    "recipes/devel/python/amd64/python-3.14.7-1/recipe.toml",
    "recipes/devel/meson/any/meson-1.7.0-1/recipe.toml",
    "recipes/devel/pahole/amd64/pahole-1.28-1/recipe.toml"
]

# 阶段 7: 基础系统与设备管理、文件系统、网络、Init 与可引导内核
[[stages]]
name = "stage7-bootable-base"
recipes = [
    "recipes/tools/e2fsprogs/amd64/e2fsprogs-1.47.4-1/recipe.toml",
    "recipes/utils/util-linux/amd64/util-linux-2.42.3-1/recipe.toml",
    "recipes/security/shadow/amd64/shadow-4.20.2-1/recipe.toml",
    "recipes/system/kmod/amd64/kmod-34.2-1/recipe.toml",
    "recipes/utils/procps-ng/amd64/procps-ng-4.0.6-1/recipe.toml",
    "recipes/net/iproute2/amd64/iproute2-7.2.0-1/recipe.toml",
    "recipes/net/dhcpcd/amd64/dhcpcd-10.5.2-1/recipe.toml",
    "recipes/security/pam/amd64/pam-1.7.2-1/recipe.toml",
    "recipes/system/systemd/amd64/systemd-261.2-2/recipe.toml",
    "recipes/system/linux-zen/amd64/linux-zen-7.2.4-1/recipe.toml",
    "recipes/utils/fastfetch/amd64/fastfetch-2.68.1-1/recipe.toml"
]

# 阶段 8: 最小系统元软件包 (发布最小可引导 rootfs 依赖树)
[[stages]]
name = "stage8-meta"
recipes = [
    "recipes/system/base/any/base-1.0.0-1/recipe.toml"
]

# 阶段 9: 会话基础库、PAM 与消息总线
[[stages]]
name = "stage9-session-foundation"
recipes = [
    "recipes/tools/bzip2/amd64/bzip2-1.0.8-1/recipe.toml",
    "recipes/lib/expat/amd64/expat-2.8.4-1/recipe.toml",
    "recipes/lib/pcre2/amd64/pcre2-10.48-1/recipe.toml",
    "recipes/lib/json-c/amd64/json-c-0.19-1/recipe.toml",
    "recipes/lib/libpng/amd64/libpng-1.6.58-1/recipe.toml",
    "recipes/lib/duktape/amd64/duktape-2.7.0-1/recipe.toml",
    "recipes/system/dbus/amd64/dbus-1.16.2-1/recipe.toml"
]

# 阶段 10: 字体与文本渲染栈
[[stages]]
name = "stage10-text-rendering"
recipes = [
    "recipes/lib/libxml2/amd64/libxml2-2.15.4-1/recipe.toml",
    "recipes/lib/freetype2/amd64/freetype2-2.14.3-1/recipe.toml",
    "recipes/lib/fontconfig/amd64/fontconfig-2.18.3-1/recipe.toml",
    "recipes/lib/harfbuzz/amd64/harfbuzz-14.4.0-1/recipe.toml",
    "recipes/lib/fribidi/amd64/fribidi-1.0.16-1/recipe.toml",
    "recipes/lib/glib2/amd64/glib2-2.88.3-1/recipe.toml",
    "recipes/lib/pixman/amd64/pixman-0.46.4-1/recipe.toml",
    "recipes/lib/cairo/amd64/cairo-1.18.4-1/recipe.toml",
    "recipes/lib/pango/amd64/pango-1.58.2-1/recipe.toml"
]

# 阶段 11: Wayland、输入与 seat 管理
[[stages]]
name = "stage11-wayland-foundation"
recipes = [
    "recipes/lib/wayland/amd64/wayland-1.26.0-1/recipe.toml",
    "recipes/lib/wayland-protocols/any/wayland-protocols-1.49-1/recipe.toml",
    "recipes/lib/libdrm/amd64/libdrm-2.4.134-1/recipe.toml",
    "recipes/lib/libdisplay-info/amd64/libdisplay-info-0.3.0-1/recipe.toml",
    "recipes/lib/libxkbcommon/amd64/libxkbcommon-1.13.2-1/recipe.toml",
    "recipes/lib/xkeyboard-config/any/xkeyboard-config-2.48-1/recipe.toml",
    "recipes/lib/libevdev/amd64/libevdev-1.13.7-1/recipe.toml",
    "recipes/lib/mtdev/amd64/mtdev-1.1.7-1/recipe.toml",
    "recipes/lib/libinput/amd64/libinput-1.31.3-1/recipe.toml",
    "recipes/system/seatd/amd64/seatd-0.9.3-1/recipe.toml"
